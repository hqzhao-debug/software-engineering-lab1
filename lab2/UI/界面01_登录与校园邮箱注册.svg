<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F7F8" stroke="#F4F7F8"/><rect x="0" y="0" width="220" height="1000" rx="0" fill="#102D39" stroke="#102D39"/><rect x="25" y="30" width="36" height="36" rx="9" fill="#147D72" stroke="#147D72"/><text x="34" y="57" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="22" fill="#FFFFFF">循</text><text x="73" y="51" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="23" fill="#FFFFFF">校园循物</text><text x="73" y="70" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="10" fill="#99BBC4">CAMPUS REUSE</text><text x="28" y="126" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#99BBC4">让闲置继续发光</text><rect x="30" y="170" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="181" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">商品广场</text><rect x="30" y="227" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="238" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">登录与注册</text><path d="M25 884L195 884" stroke="#31505A"/><text x="28" y="920" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AAC1C8">访客 · 尚未登录</text><text x="28" y="958" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#FFFFFF">返回商品广场</text><rect x="220" y="0" width="1220" height="84" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="258" y="44" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="17" fill="#14343F">校园二手交易系统</text><rect x="1162" y="27" width="116" height="28" rx="6" fill="#E6F3EE" stroke="#E6F3EE"/><text x="1173" y="44" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">校园面交</text><text x="1300" y="46" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">帮助说明</text><text x="258" y="143" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#14343F">登录与校园邮箱注册</text><text x="258" y="177" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#657C84">验证校园邮箱后即可使用；同一个普通账号兼任买家和卖家。</text><text x="258" y="982" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" fill="#657C84">UI-01  ·  桌面端界面设计  ·  所有账号、商品与统计数据均为虚构示例</text><rect x="258" y="208" width="466" height="694" rx="12" fill="#FFFFFF" stroke="#DBE5E8"/><text x="282" y="250" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">欢迎回来</text><text x="284" y="275" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#657C84">登录后查看你的商品与预约</text><text x="284" y="324" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">用户名或邮箱</text><rect x="284" y="338" width="412" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="298" y="366" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">请输入用户名或已验证邮箱</text><text x="284" y="434" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">密码</text><rect x="284" y="448" width="412" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="298" y="476" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">••••••••</text><rect x="284" y="530" width="412" height="42" rx="7" fill="#147D72" stroke="#147D72"/><text x="475.0" y="554" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#FFFFFF">登录</text><rect x="284" y="606" width="412" height="148" rx="9" fill="#E6F3EE" stroke="#E6F3EE"/><text x="302" y="635" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#147D72">登录状态说明</text><text x="302" y="662" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">密码错误与账号不存在均显示相同提示。</text><text x="302" y="686" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">连续第 5 次密码错误，固定锁定 15 分钟。</text><text x="302" y="710" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">每个会话独立计时，30 分钟无主动请求失效。</text><text x="302" y="734" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">后台自动刷新不延长登录有效时间。</text><text x="284" y="811" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#147D72">浏览公开商品无需登录</text><rect x="748" y="208" width="650" height="694" rx="12" fill="#FFFFFF" stroke="#DBE5E8"/><text x="772" y="250" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">注册普通账号</text><text x="774" y="281" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">用户名 *</text><rect x="774" y="295" width="286" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="788" y="323" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">请输入用户名</text><text x="1082" y="281" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">学号 / 工号 *</text><rect x="1082" y="295" width="290" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="1096" y="323" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">请输入学号或工号</text><text x="774" y="383" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">本校官方邮箱 *</text><rect x="774" y="397" width="598" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="788" y="425" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">请输入本校官方邮箱</text><text x="774" y="460" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" fill="#657C84">请使用学校提供的官方邮箱地址</text><text x="774" y="495" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">密码 *</text><rect x="774" y="509" width="598" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="788" y="537" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">请输入密码</text><rect x="774" y="587" width="598" height="42" rx="7" fill="#147D72" stroke="#147D72"/><text x="1005.5" y="611" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#FFFFFF">提交并发送验证邮件</text><rect x="774" y="659" width="598" height="100" rx="9" fill="#E6F3EE" stroke="#E6F3EE"/><text x="792" y="688" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#147D72">待验证：请检查校园邮箱</text><text x="792" y="715" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">完成邮件中的验证后，才可登录。</text><text x="792" y="739" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">邮箱、用户名、学号 / 工号须各自唯一。</text><text x="774" y="804" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">注册仅验证邮箱归属，不接入校方学籍核验。</text><text x="774" y="838" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">管理员账号由已有管理员在后台创建。</text></svg>