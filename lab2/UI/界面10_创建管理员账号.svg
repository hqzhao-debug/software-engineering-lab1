<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F7F8" stroke="#F4F7F8"/><rect x="0" y="0" width="220" height="1000" rx="0" fill="#102D39" stroke="#102D39"/><rect x="25" y="30" width="36" height="36" rx="9" fill="#147D72" stroke="#147D72"/><text x="34" y="57" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="22" fill="#FFFFFF">循</text><text x="73" y="51" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="23" fill="#FFFFFF">校园循物</text><text x="73" y="70" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="10" fill="#99BBC4">CAMPUS REUSE</text><text x="28" y="126" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#99BBC4">管理工作台</text><rect x="30" y="170" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="181" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">商品审核</text><rect x="30" y="227" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="238" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">违规与账号</text><rect x="16" y="271" width="188" height="44" rx="8" fill="#224A55" stroke="#224A55"/><rect x="16" y="277" width="4" height="32" rx="2" fill="#6ED1B7" stroke="#6ED1B7"/><rect x="30" y="284" width="13" height="13" rx="3" fill="#6ED1B7" stroke="#6ED1B7"/><text x="57" y="295" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#FFFFFF">创建管理员</text><rect x="30" y="341" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="352" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">平台统计</text><rect x="30" y="398" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="409" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">管理日志</text><path d="M25 884L195 884" stroke="#31505A"/><text x="28" y="920" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AAC1C8">管理员 · 示例账号</text><text x="28" y="958" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#FFFFFF">退出登录</text><rect x="220" y="0" width="1220" height="84" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="258" y="44" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="17" fill="#14343F">校园二手交易系统</text><rect x="1162" y="27" width="116" height="28" rx="6" fill="#E6F3EE" stroke="#E6F3EE"/><text x="1173" y="44" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">管理员后台</text><text x="1300" y="46" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">帮助说明</text><text x="258" y="143" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#14343F">创建管理员账号</text><text x="258" y="177" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#657C84">仅已有管理员可创建；新账号验证校园邮箱后才能登录。</text><text x="258" y="982" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" fill="#657C84">UI-10  ·  桌面端界面设计  ·  所有账号、商品与统计数据均为虚构示例</text><rect x="258" y="208" width="740" height="714" rx="12" fill="#FFFFFF" stroke="#DBE5E8"/><text x="282" y="250" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">新管理员资料</text><text x="284" y="293" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">用户名 *</text><rect x="284" y="307" width="686" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="298" y="335" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">请输入新管理员用户名</text><text x="284" y="404" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">本校官方邮箱 *</text><rect x="284" y="418" width="686" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="298" y="446" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">请输入新管理员校园邮箱</text><text x="284" y="515" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">学号 / 工号 *</text><rect x="284" y="529" width="686" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="298" y="557" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">请输入学号或工号</text><text x="284" y="626" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">密码 *</text><rect x="284" y="640" width="686" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="298" y="668" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">输入初始密码（不在日志或结果中显示）</text><rect x="284" y="752" width="686" height="42" rx="7" fill="#147D72" stroke="#147D72"/><text x="559.5" y="776" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#FFFFFF">创建并发送验证邮件</text><text x="284" y="838" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">用户名、邮箱和学号 / 工号均须在全部账号中唯一。</text><text x="284" y="873" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">验证前账号不可登录；提交失败保留非敏感有效输入。</text><rect x="1022" y="208" width="376" height="172" rx="9" fill="#E6F3EE" stroke="#E6F3EE"/><text x="1040" y="237" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#147D72">管理员权限边界</text><text x="1040" y="264" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">可以审核商品与处理违规。</text><text x="1040" y="288" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">可以封禁 / 解封普通账号。</text><text x="1040" y="312" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">可以查询管理所需日志与统计。</text><text x="1040" y="336" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">不能参与普通交易。</text><text x="1040" y="360" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">不能代替卖家确认或完成。</text><rect x="1022" y="427" width="376" height="260" rx="12" fill="#FFFFFF" stroke="#DBE5E8"/><text x="1046" y="469" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">创建结果示例</text><rect x="1046" y="492" width="140" height="28" rx="6" fill="#FFF4DF" stroke="#FFF4DF"/><text x="1057" y="509" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AC6B16">待邮箱验证</text><text x="1046" y="559" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#14343F">账号：campus_admin_02</text><text x="1046" y="601" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">验证完成后可登录管理工作台。</text><text x="1046" y="643" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">页面和日志不显示密码。</text><rect x="1022" y="714" width="376" height="124" rx="9" fill="#E6F3EE" stroke="#E6F3EE"/><text x="1040" y="743" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#147D72">建号规则</text><text x="1040" y="770" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">首个启动管理员由课程方预设。</text><text x="1040" y="794" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">不提供已有普通账号提权入口。</text><text x="1040" y="818" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">公开注册不能选择管理员角色。</text></svg>