iragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#FFFFFF">提交预约</text><text x="848" y="693" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">提交成功后为待确认，等待卖家处理。</text><rect x="258" y="760" width="1140" height="76" rx="9" fill="#FFF4DF" stroke="#FFF4DF"/><text x="276" y="789" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AC6B16">提交时发现商品信息已变化</text><text x="276" y="816" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AC6B16">此次未创建预约，请重新加载商品并确认最新标题和价格。已填写的面交留言保留。</text><rect x="1160" y="865" width="214" height="42" rx="7" fill="#147D72" stroke="#147D72"/><text x="1222.0" y="889" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#FFFFFF">重新加载商品</text><text x="278" y="889" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">上方为正常详情；此处展示旧页面提交时的冲突反馈。</text></svg>