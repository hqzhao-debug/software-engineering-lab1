<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F7F8" stroke="#F4F7F8"/><rect x="0" y="0" width="220" height="1000" rx="0" fill="#102D39" stroke="#102D39"/><rect x="25" y="30" width="36" height="36" rx="9" fill="#147D72" stroke="#147D72"/><text x="34" y="57" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="22" fill="#FFFFFF">循</text><text x="73" y="51" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="23" fill="#FFFFFF">校园循物</text><text x="73" y="70" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="10" fill="#99BBC4">CAMPUS REUSE</text><text x="28" y="126" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#99BBC4">管理工作台</text><rect x="30" y="170" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="181" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">商品审核</text><rect x="16" y="214" width="188" height="44" rx="8" fill="#224A55" stroke="#224A55"/><rect x="16" y="220" width="4" height="32" rx="2" fill="#6ED1B7" stroke="#6ED1B7"/><rect x="30" y="227" width="13" height="13" rx="3" fill="#6ED1B7" stroke="#6ED1B7"/><text x="57" y="238" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#FFFFFF">违规与账号</text><rect x="30" y="284" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="295" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">创建管理员</text><rect x="30" y="341" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="352" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">平台统计</text><rect x="30" y="398" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="409" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">管理日志</text><path d="M25 884L195 884" stroke="#31505A"/><text x="28" y="920" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AAC1C8">管理员 · 示例账号</text><text x="28" y="958" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#FFFFFF">退出登录</text><rect x="220" y="0" width="1220" height="84" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="258" y="44" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="17" fill="#14343F">校园二手交易系统</text><rect x="1162" y="27" width="116" height="28" rx="6" fill="#E6F3EE" stroke="#E6F3EE"/><text x="1173" y="44" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">管理员后台</text><text x="1300" y="46" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">帮助说明</text><text x="258" y="143" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#14343F">违规处理与账号管理</text><text x="258" y="177" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#657C84">处理需要写明原因，并保留商品、预约和管理历史。</text><text x="258" y="982" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" fill="#657C84">UI-09  ·  桌面端界面设计  ·  所有账号、商品与统计数据均为虚构示例</text><rect x="258" y="208" width="554" height="714" rx="12" fill="#FFFFFF" stroke="#DBE5E8"/><text x="282" y="250" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">商品违规处理</text><text x="282" y="286" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">商品编号</text><rect x="282" y="300" width="506" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="296" y="328" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">P-0236</text><text x="282" y="395" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">目标：二手电子设备</text><rect x="282" y="419" width="180" height="28" rx="6" fill="#E6F3EE" stroke="#E6F3EE"/><text x="293" y="436" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">已确认（待面交）</text><text x="282" y="488" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">违规原因 *</text><rect x="282" y="502" width="506" height="90" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="296" y="530" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">描述存在明显虚假信息。</text><rect x="282" y="626" width="506" height="100" rx="9" fill="#FFF4DF" stroke="#FFF4DF"/><text x="300" y="655" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AC6B16">处理后果</text><text x="300" y="682" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AC6B16">商品转为违规下架，关联有效预约同步取消。</text><text x="300" y="706" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AC6B16">预约原因显示“违规终止”，双方保留历史。</text><rect x="282" y="755" width="506" height="42" rx="7" fill="#FCEDEB" stroke="#FCEDEB"/><text x="490.0" y="779" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#B14E47">确认违规下架</text><text x="282" y="844" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">已成交商品只加违规标记，不回退成交及统计。</text><text x="282" y="874" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">修改后重审通过可恢复，无独立“解封商品”。</text><rect x="838" y="208" width="560" height="714" rx="12" fill="#FFFFFF" stroke="#DBE5E8"/><text x="862" y="250" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">普通账号管理</text><text x="862" y="286" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">用户名 / 账号编号</text><rect x="862" y="300" width="510" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="876" y="328" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">示例用户 / U-0098</text><rect x="862" y="372" width="78" height="28" rx="6" fill="#E6F3EE" stroke="#E6F3EE"/><text x="873" y="389" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">账号正常</text><text x="862" y="438" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">封禁将立即使现有登录失效。</text><text x="862" y="488" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">封禁原因 *</text><rect x="862" y="502" width="510" height="90" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="876" y="530" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">多次提交违反固定禁止规则的商品。</text><rect x="862" y="626" width="510" height="100" rx="9" fill="#FFF4DF" stroke="#FFF4DF"/><text x="880" y="655" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AC6B16">关联处理</text><text x="880" y="682" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AC6B16">取消该账号作为买家或卖家的全部有效预约。</text><text x="880" y="706" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AC6B16">其未成交非草稿商品下架，私人草稿保留。</text><rect x="862" y="755" width="245" height="42" rx="7" fill="#FCEDEB" stroke="#FCEDEB"/><text x="954.5" y="779" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#B14E47">封禁账号</text><rect x="1127" y="755" width="245" height="42" rx="7" fill="#EEF3F5" stroke="#EEF3F5"/><text x="1219.5" y="779" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#9AAEB5">解除封禁</text><text x="862" y="844" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">已封禁账号显示“解除封禁”，由管理员手动解除。</text><text x="862" y="874" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">解封后不恢复旧预约，不自动上架商品。</text></svg>