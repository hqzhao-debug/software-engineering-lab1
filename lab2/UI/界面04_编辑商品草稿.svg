<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F7F8" stroke="#F4F7F8"/><rect x="0" y="0" width="220" height="1000" rx="0" fill="#102D39" stroke="#102D39"/><rect x="25" y="30" width="36" height="36" rx="9" fill="#147D72" stroke="#147D72"/><text x="34" y="57" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="22" fill="#FFFFFF">循</text><text x="73" y="51" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="23" fill="#FFFFFF">校园循物</text><text x="73" y="70" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="10" fill="#99BBC4">CAMPUS REUSE</text><text x="28" y="126" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#99BBC4">让闲置继续发光</text><rect x="30" y="170" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="181" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">商品广场</text><rect x="16" y="214" width="188" height="44" rx="8" fill="#224A55" stroke="#224A55"/><rect x="16" y="220" width="4" height="32" rx="2" fill="#6ED1B7" stroke="#6ED1B7"/><rect x="30" y="227" width="13" height="13" rx="3" fill="#6ED1B7" stroke="#6ED1B7"/><text x="57" y="238" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#FFFFFF">发布商品</text><rect x="30" y="284" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="295" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">我的商品</text><rect x="30" y="341" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="352" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">我预约的</text><rect x="30" y="398" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="409" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">收到的预约</text><rect x="30" y="455" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="466" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">我的统计</text><rect x="30" y="512" width="13" height="13" rx="3" fill="#718F98" stroke="#718F98"/><text x="57" y="523" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#AAC1C8">操作历史</text><path d="M25 884L195 884" stroke="#31505A"/><text x="28" y="920" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#AAC1C8">普通用户 · 示例账号</text><text x="28" y="958" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#FFFFFF">退出登录</text><rect x="220" y="0" width="1220" height="84" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="258" y="44" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="17" fill="#14343F">校园二手交易系统</text><rect x="1162" y="27" width="116" height="28" rx="6" fill="#E6F3EE" stroke="#E6F3EE"/><text x="1173" y="44" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">校园面交</text><text x="1300" y="46" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">帮助说明</text><text x="258" y="143" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="30" fill="#14343F">编辑商品草稿</text><text x="258" y="177" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#657C84">保存为私人草稿；提交审核后内容锁定，通过后才公开展示。</text><text x="258" y="982" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" fill="#657C84">UI-04  ·  桌面端界面设计  ·  所有账号、商品与统计数据均为虚构示例</text><rect x="258" y="208" width="740" height="714" rx="12" fill="#FFFFFF" stroke="#DBE5E8"/><text x="282" y="250" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">商品资料</text><text x="282" y="287" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">标题 *</text><rect x="282" y="301" width="692" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="296" y="329" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">数据结构与算法</text><text x="282" y="364" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" fill="#657C84">提交时 2～50 字；保存草稿时标题不能为空</text><text x="282" y="404" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">分类 *</text><rect x="282" y="418" width="332" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="296" y="446" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">教材书籍  ▾</text><text x="640" y="404" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">成色 *</text><rect x="640" y="418" width="334" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="654" y="446" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">九成新  ▾</text><text x="282" y="512" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">价格（元） *</text><rect x="282" y="526" width="332" height="44" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="296" y="554" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">36.00</text><text x="282" y="589" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" fill="#657C84">0.01～99999.99，最多两位小数</text><text x="640" y="512" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">交付方式</text><rect x="640" y="535" width="158" height="28" rx="6" fill="#E6F3EE" stroke="#E6F3EE"/><text x="651" y="552" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">校园线下面交</text><text x="282" y="630" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" fill="#657C84">描述（选填）</text><rect x="282" y="644" width="692" height="90" rx="6" fill="#FFFFFF" stroke="#DBE5E8"/><text x="296" y="672" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#14343F">页面整洁，少量铅笔标记。</text><text x="282" y="761" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">描述不超过 500 字；字段错误不会清空其他有效内容。</text><rect x="282" y="829" width="180" height="42" rx="7" fill="#147D72" stroke="#147D72"/><text x="342.0" y="853" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#FFFFFF">保存草稿</text><rect x="480" y="829" width="180" height="42" rx="7" fill="#FFFFFF" stroke="#DBE5E8"/><text x="540.0" y="853" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#14343F">提交审核</text><rect x="679" y="829" width="130" height="42" rx="7" fill="#FFFFFF" stroke="#DBE5E8"/><text x="714.0" y="853" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#14343F">取消编辑</text><rect x="1022" y="208" width="376" height="462" rx="12" fill="#FFFFFF" stroke="#DBE5E8"/><text x="1046" y="250" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="20" fill="#14343F">商品图片（选填）</text><rect x="1046" y="273" width="328" height="206" rx="8" fill="#EDF3F1" stroke="#EDF3F1"/><rect x="1168.0" y="330.0" width="84" height="98" rx="4" fill="#C7DDD5" stroke="#C7DDD5"/><rect x="1168.0" y="330.0" width="8" height="98" rx="3" fill="#A8C6BA" stroke="#A8C6BA"/><text x="1187.0" y="370.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" fill="#147D72">知识</text><text x="1187.0" y="398.0" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="18" fill="#147D72">常新</text><path d="M1188.0 411.0L1234.0 411.0" stroke="#6A9B88"/><text x="1046" y="525" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#14343F">1 / 5 张</text><rect x="1046" y="548" width="154" height="42" rx="7" fill="#FFFFFF" stroke="#DBE5E8"/><text x="1093.0" y="572" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#14343F">添加图片</text><rect x="1216" y="548" width="158" height="42" rx="7" fill="#FFFFFF" stroke="#DBE5E8"/><text x="1265.0" y="572" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" fill="#14343F">移除图片</text><text x="1046" y="628" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#657C84">JPG / PNG，单张不超过 5MB</text><rect x="1022" y="696" width="376" height="148" rx="9" fill="#E6F3EE" stroke="#E6F3EE"/><text x="1040" y="725" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="16" fill="#147D72">保存与提交的区别</text><text x="1040" y="752" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">保存只更新草稿，管理员不能查看。</text><text x="1040" y="776" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">修改在售内容并保存后停止公开。</text><text x="1040" y="800" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">上传失败保留文字，图片可留空。</text><text x="1040" y="824" font-family="Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" fill="#147D72">已提交过的商品不可删除。</text></svg>